# Compose pour le NAS Synology (DS218+) — utilise l'image chargée (pas de build sur le NAS).
# Placer ce fichier sur le NAS et le lancer via Container Manager (Projet) ou en SSH :
#   sudo docker compose -f docker-compose.nas.yml up -d
services:
  marees:
    image: marees-port-tudy:latest
    container_name: marees-port-tudy
    ports:
      # Écoute UNIQUEMENT sur la boucle locale du NAS : seul le reverse proxy DSM (qui tourne sur
      # le NAS et se connecte en localhost:3000) peut atteindre l'app. Ni le LAN ni Internet ne
      # peuvent taper le 3000 en direct → pas de contournement par X-Forwarded-For usurpé
      # (cf. revue sécurité VERIFY-001). L'accès se fait donc via l'URL HTTPS du proxy.
      - "127.0.0.1:3000:3000" # 127.0.0.1:hôte:conteneur — changer l'hôte (ex. 8080) si 3000 est pris
    volumes:
      # Dossier de données sur le NAS (config + horaires) — à créer au préalable.
      - /volume1/docker/marees/data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000
      # Exposition externe : valeurs lues depuis un fichier `.env` placé À CÔTÉ de ce compose
      # sur le NAS (/volume1/docker/marees/.env). Ce `.env` n'est PAS transféré par
      # push-to-nas.sh → il survit aux mises à jour et garde les secrets hors Git.
      #
      # Gestion d'utilisateurs (issue #9) : les comptes sont désormais en base, gérés dans l'app
      # (panneau « Utilisateurs », rôle admin). Les variables ci-dessous ne servent plus qu'à :
      #   - ACTIVER l'auth : dès qu'APP_PASSWORD **ou** ADMIN_PASSWORD est non vide (les deux vides
      #     → accès libre) ;
      #   - AMORCER le 1er admin (base vide) depuis ADMIN_USER/ADMIN_PASSWORD ; sans ADMIN_PASSWORD,
      #     un compte admin/admin est créé avec changement de mot de passe forcé.
      # APP_USER/APP_PASSWORD n'authentifient plus après l'amorçage (source = base). cf.
      # deploy/MIGRATION-UTILISATEURS.md.
      #   ADMIN_USER=admin
      #   ADMIN_PASSWORD=mot-de-passe-admin-initial
      #   SESSION_SECRET=chaine-aleatoire-longue    # `openssl rand -hex 32` (voir plus bas)
      #   COOKIE_SECURE=true
      - APP_USER=${APP_USER:-marees}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Secret de signature des cookies de session. Si vide, l'app en génère un aléatoire persisté
      # en base (`app_secret`). Le fixer ici (via .env) rend les sessions stables entre recréations
      # du volume et permet de les révoquer toutes en le changeant. `openssl rand -hex 32`.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Cookie de session en HTTPS : garantit le flag `Secure` même si le proxy DSM ne transmet
      # pas `X-Forwarded-Proto` (cf. revue sécurité INFO-003). L'accès étant désormais uniquement
      # via le proxy HTTPS, on peut le laisser à `true` par défaut ici.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    restart: unless-stopped
